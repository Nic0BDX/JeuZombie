<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#191d20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Les Cendres du Marais</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#191d20;color:#e5e8d8}
body{height:100dvh;position:relative}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#fps{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);font:bold 15px monospace;background:#171a20df;padding:6px 9px;pointer-events:none}

[hidden]{display:none!important}
:root{font:16px system-ui,sans-serif;color-scheme:dark}
#fps{top:calc(env(safe-area-inset-top) + 31px);font-size:14px;z-index:3}
#hud{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font:bold 14px monospace}
.track{height:8px;background:#161c27;overflow:hidden}
.track i{display:block;height:100%;background:#71b9ef;width:0}
.hud-top{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:4px 10px}
#clock{text-align:center;font-size:21px}
button{font:inherit;min-height:48px;min-width:48px;padding:8px 13px;color:#f6edda;background:#373442;border:1px solid #706473;text-align:center;cursor:pointer}
button:focus-visible{outline:2px solid #bde3ce;outline-offset:2px}
button:disabled{opacity:.45}
#pause{justify-self:start;pointer-events:auto;font-size:19px}
#boss{margin:0 auto;text-align:center;width:min(64%,320px);color:#f9bdc1}
#boss i{background:#cf6886}
#kit{position:absolute;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 75px);display:grid;gap:3px}
#kit .empty{opacity:.42;text-align:center}
#kit span{min-width:28px;background:#171a20de;padding:2px 4px}
#menu{position:absolute;inset:0;display:flex;align-items:end;justify-content:center;background:#14151db5;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#panel{width:min(100%,440px);max-height:100%;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;background:#23252f;padding:16px;border:1px solid #696375;box-shadow:0 8px 40px #101116;text-align:center}
#panel *{touch-action:pan-y}
h1,h2{font-family:monospace;margin:0 0 12px;color:#f2dbad}
h1{font-size:clamp(26px,7vw,38px)}
h2{font-size:24px}
p{margin:5px 0 12px}
.actions{display:grid;gap:7px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.volume{min-height:48px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left}
.volume input{width:100%;touch-action:none}
.primary{background:#3a5349;border-color:#83aa8d}
.card{display:grid;grid-template-columns:36px 1fr;align-items:center;text-align:left;min-height:60px}
.card b:first-child{font-size:23px;color:#badfc3}
#experience{transition:width .18s ease-out}
.upgrade{border-color:var(--rarity);min-height:68px}
.upgrade em{display:block;font:700 12px monospace;color:var(--rarity)}
.upgrade b{width:27px;line-height:26px;background:#212a34;text-align:center}
.upgrade .card-rank{color:var(--rarity);white-space:nowrap;font-size:.86rem}
.card-tools button:last-child{grid-column:1/-1}
@media(prefers-reduced-motion:reduce){#experience{transition:none}}
.card small{display:block;font-size:14px;color:#ddd4d5}
.chest{font-size:46px;color:#ffd98d;animation:open .45s ease-out}
@keyframes open{0%{transform:scale(.2) rotate(-15deg);opacity:.2}70%{transform:scale(1.18)}}
@media(max-height:420px){#panel{padding:10px}h1,h2,p{margin-bottom:5px}.actions{gap:4px}}
#menu[data-meta-page="home"]{isolation:isolate;overflow:hidden}
#menu[data-meta-page="home"]::before,#menu[data-meta-page="home"]::after{content:"";position:absolute;inset:-18%;z-index:-1;pointer-events:none}
#menu[data-meta-page="home"]::before{background:radial-gradient(ellipse at 30% 45%,#72817d48 0%,transparent 57%),radial-gradient(ellipse at 74% 62%,#a5a89c26 0%,transparent 50%);animation:marsh-fog 12s ease-in-out infinite alternate}
#menu[data-meta-page="home"]::after{background:radial-gradient(circle at 23% 37%,#d9985a 1px,transparent 3px),radial-gradient(circle at 76% 48%,#dfa062 1px,transparent 3px),radial-gradient(circle at 53% 27%,#f5a864 1px,transparent 3px),radial-gradient(circle at 43% 57%,#eac281 1px,transparent 3px);animation:marsh-embers 8s ease-in infinite}
@keyframes marsh-fog{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@keyframes marsh-embers{0%{opacity:0;transform:translateY(12%)}40%{opacity:.8}100%{opacity:0;transform:translateY(-18%)}}
@media(prefers-reduced-motion:reduce){#menu::before,#menu::after{animation:none!important}}
.meta-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:9px}
.meta-tabs button{padding-inline:2px;min-width:0;font-size:clamp(10px,3.4vw,14px);overflow-wrap:anywhere}
.meta-bonuses,.collection-list{list-style:none;text-align:left;padding:0;margin:8px 0 12px}
.collection-list li,.meta-bonuses li{background:#302f3b;padding:8px;border-bottom:1px solid #4d4656}
.collection-list small{display:block;color:#ddd4d5;font-size:14px}
.meta-volume{display:grid;grid-template-columns:auto minmax(100px,1fr);min-height:48px;align-items:center;gap:12px;text-align:left}
.meta-volume input{width:100%;accent-color:#9bc9a9}
summary{min-height:48px;padding:12px 8px;cursor:pointer;text-align:left;background:#373442}
.left-handed #pause{grid-column:3;grid-row:1;justify-self:end}
.left-handed #clock{grid-column:2;grid-row:1}
.left-handed #level{grid-column:1;grid-row:1}
.left-handed #kit{left:auto;right:calc(env(safe-area-inset-right) + 10px)}

.upgrade{box-shadow:inset 0 0 12px color-mix(in srgb,var(--rarity) 24%,transparent)}
.chest.evolved{color:#ffdb87;text-shadow:0 0 18px #ee8256;animation:open .52s ease-out}
.left-handed #fps{right:auto;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 68px)}
.account-form{display:grid;gap:7px;margin-bottom:14px}
.account-form label{display:grid;gap:5px;text-align:left}
.account-form input{width:100%;min-height:48px;padding:8px 10px;font:inherit;color:inherit;background:#191a23;border:1px solid #706473;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.social-list{list-style:none;margin:10px 0;padding:0;text-align:left}
.social-list li,.social-room{padding:8px;border:1px solid #696375;margin-bottom:6px}
.social-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
#social-banner{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 84px);left:50%;transform:translateX(-50%);display:flex;gap:4px;width:max-content;max-width:96%}
#social-banner button:first-child{background:#3a5349}
.coop-settings{display:grid;gap:6px;margin-top:8px}
.coop-settings select{min-height:48px;font:inherit}
#quick-emotes{position:absolute;top:calc(env(safe-area-inset-top) + 76px);right:calc(env(safe-area-inset-right) + 8px);z-index:4;display:grid;justify-items:end;gap:4px}
#quick-emotes>div{display:grid;grid-template-columns:repeat(2,minmax(48px,1fr));gap:4px}
.left-handed #quick-emotes{right:auto;left:calc(env(safe-area-inset-left) + 8px);justify-items:start}
#choice-timer{color:#ffdc93;font:inherit}
</style>
<canvas aria-label="Les Cendres du Marais"></canvas>
<div id="hud" hidden>
  <div class="track"><i id="experience"></i></div>
  <div class="hud-top"><button id="pause" type="button" aria-label="Pause">Ⅱ</button><span id="clock"></span><span id="level"></span></div>
  <div id="boss" hidden><span></span><div class="track"><i></i></div></div>
  <div id="kit"></div>
</div>
<aside id="quick-emotes" aria-label="Emotes rapides" hidden></aside>
<aside id="social-banner" aria-label="Invitations" hidden></aside>
<section id="menu"><div id="panel"></div></section>
<output id="fps">– FPS</output>
<script type="module" src="./main.js"></script>
