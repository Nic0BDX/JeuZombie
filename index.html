<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#191d20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Les Cendres du Marais</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
html,body{margin:0;overflow:hidden;overscroll-behavior:none;background:#191d20;color:#e5e8d8}
body{height:100dvh;position:relative}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#fps{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);font:bold 15px monospace;background:#171a20df;padding:6px 9px;pointer-events:none}

[hidden]{display:none!important}
:root{font:16px system-ui,sans-serif;color-scheme:dark}
#fps{top:calc(env(safe-area-inset-top) + 31px);font-size:14px;z-index:3}
#hud{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font:bold 14px monospace}
.track{height:8px;background:#161c27;overflow:hidden}
.track i{display:block;height:100%;background:#71b9ef;width:0}
.hud-top{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:4px 10px}
#clock{text-align:center;font-size:21px}
button{font:inherit;min-height:48px;min-width:48px;padding:8px 13px;color:#f6edda;background:#373442;border:1px solid #706473;text-align:center;cursor:pointer}
button:focus-visible{outline:2px solid #bde3ce;outline-offset:2px}
button:disabled{opacity:.45}
#pause{justify-self:start;pointer-events:auto;font-size:19px}
#boss{margin:0 auto;text-align:center;width:min(64%,320px);color:#f9bdc1}
#boss i{background:#cf6886}
#kit{position:absolute;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 75px);display:grid;gap:3px}
#kit .empty{opacity:.42;text-align:center}
#kit span{min-width:28px;background:#171a20de;padding:2px 4px}
#menu{position:absolute;inset:0;display:flex;align-items:end;justify-content:center;background:#14151db5;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#panel{width:min(100%,440px);max-height:100%;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;background:#23252f;padding:16px;border:1px solid #696375;box-shadow:0 8px 40px #101116;text-align:center}
#panel *{touch-action:pan-y}
h1,h2{font-family:monospace;margin:0 0 12px;color:#f2dbad}
h1{font-size:clamp(26px,7vw,38px)}
h2{font-size:24px}
p{margin:5px 0 12px}
.actions{display:grid;gap:7px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.volume{min-height:48px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left}
.volume input{width:100%;touch-action:none}
.primary{background:#3a5349;border-color:#83aa8d}
.card{display:grid;grid-template-columns:36px 1fr;align-items:center;text-align:left;min-height:60px}
.card b:first-child{font-size:23px;color:#badfc3}
#experience{transition:width .18s ease-out}
.upgrade{border-color:var(--rarity);min-height:68px}
.upgrade em{display:block;font:700 12px monospace;color:var(--rarity)}
.upgrade b{width:27px;line-height:26px;background:#212a34;text-align:center}
.upgrade .card-rank{color:var(--rarity);white-space:nowrap;font-size:.86rem}
.card-tools button:last-child{grid-column:1/-1}
@media(prefers-reduced-motion:reduce){#experience{transition:none}}
.card small{display:block;font-size:14px;color:#ddd4d5}
.chest{font-size:46px;color:#ffd98d;animation:open .45s ease-out}
@keyframes open{0%{transform:scale(.2) rotate(-15deg);opacity:.2}70%{transform:scale(1.18)}}
@media(max-height:420px){#panel{padding:10px}h1,h2,p{margin-bottom:5px}.actions{gap:4px}}
#menu[data-meta-page="home"]{isolation:isolate;overflow:hidden}
#menu[data-meta-page="home"]::before,#menu[data-meta-page="home"]::after{content:"";position:absolute;inset:-18%;z-index:-1;pointer-events:none}
#menu[data-meta-page="home"]::before{background:radial-gradient(ellipse at 30% 45%,#72817d48 0%,transparent 57%),radial-gradient(ellipse at 74% 62%,#a5a89c26 0%,transparent 50%);animation:marsh-fog 12s ease-in-out infinite alternate}
#menu[data-meta-page="home"]::after{background:radial-gradient(circle at 23% 37%,#d9985a 1px,transparent 3px),radial-gradient(circle at 76% 48%,#dfa062 1px,transparent 3px),radial-gradient(circle at 53% 27%,#f5a864 1px,transparent 3px),radial-gradient(circle at 43% 57%,#eac281 1px,transparent 3px);animation:marsh-embers 8s ease-in infinite}
@keyframes marsh-fog{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
@keyframes marsh-embers{0%{opacity:0;transform:translateY(12%)}40%{opacity:.8}100%{opacity:0;transform:translateY(-18%)}}
@media(prefers-reduced-motion:reduce){#menu::before,#menu::after{animation:none!important}}
.meta-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:9px}
.meta-tabs button{padding-inline:2px;min-width:0;font-size:clamp(10px,3.4vw,14px);overflow-wrap:anywhere}
.meta-bonuses,.collection-list{list-style:none;text-align:left;padding:0;margin:8px 0 12px}
.collection-list li,.meta-bonuses li{background:#302f3b;padding:8px;border-bottom:1px solid #4d4656}
.collection-list small{display:block;color:#ddd4d5;font-size:14px}
.meta-volume{display:grid;grid-template-columns:auto minmax(100px,1fr);min-height:48px;align-items:center;gap:12px;text-align:left}
.meta-volume input{width:100%;accent-color:#9bc9a9}
summary{min-height:48px;padding:12px 8px;cursor:pointer;text-align:left;background:#373442}
.left-handed #pause{grid-column:3;grid-row:1;justify-self:end}
.left-handed #clock{grid-column:2;grid-row:1}
.left-handed #level{grid-column:1;grid-row:1}
.left-handed #kit{left:auto;right:calc(env(safe-area-inset-right) + 10px)}

.upgrade{box-shadow:inset 0 0 12px color-mix(in srgb,var(--rarity) 24%,transparent)}
.chest.evolved{color:#ffdb87;text-shadow:0 0 18px #ee8256;animation:open .52s ease-out}
.left-handed #fps{right:auto;left:calc(env(safe-area-inset-left) + 12px);top:calc(env(safe-area-inset-top) + 68px)}
.account-form{display:grid;gap:7px;margin-bottom:14px}
.account-form label{display:grid;gap:5px;text-align:left}
.account-form input{width:100%;min-height:48px;padding:8px 10px;font:inherit;color:inherit;background:#191a23;border:1px solid #706473;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.social-list{list-style:none;margin:10px 0;padding:0;text-align:left}
.social-list li,.social-room{padding:8px;border:1px solid #696375;margin-bottom:6px}
.social-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
#social-banner{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 84px);left:50%;transform:translateX(-50%);display:flex;gap:4px;width:max-content;max-width:96%}
#social-banner button:first-child{background:#3a5349}
.coop-settings{display:grid;gap:6px;margin-top:8px}
.coop-settings select{min-height:48px;font:inherit}
#quick-emotes{position:absolute;top:calc(env(safe-area-inset-top) + 76px);right:calc(env(safe-area-inset-right) + 8px);z-index:4;display:grid;justify-items:end;gap:4px}
#quick-emotes>div{display:grid;grid-template-columns:repeat(2,minmax(48px,1fr));gap:4px}
.left-handed #quick-emotes{right:auto;left:calc(env(safe-area-inset-left) + 8px);justify-items:start}
#choice-timer{color:#ffdc93;font:inherit}

#menu[data-meta-page=home]{display:block;padding:0;background:#100d17;overflow:hidden}
#home-art{display:none}
#menu[data-meta-page=home] #home-art{display:block;position:absolute;top:65px;left:50%;transform:translateX(-50%);width:min(100%,560px);height:min(63dvh,570px);object-fit:cover;object-position:center 61%;pointer-events:none}
#menu[data-meta-page=home] #panel{display:block;position:relative;width:min(100%,560px);height:100%;margin:auto;max-height:100%;border:0;border-radius:0;background:linear-gradient(180deg,#120e18 0,#120e1877 18%,transparent 42%,#120e184d 50%,#120e18 75%);padding:calc(10px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left));box-shadow:none;overflow:auto;overscroll-behavior:contain}
.hub-header{display:grid;grid-template-columns:minmax(100px,1fr) auto auto 48px;gap:5px;text-align:left}
.hub-header button{border-color:#755054;background:linear-gradient(125deg,#3a2833,#19171e 75%);font-family:monospace;padding:4px 7px;display:flex;gap:6px;align-items:center;justify-content:center}
.hub-header .hub-profile{justify-content:start;min-width:0}
.hub-profile span{display:grid;min-width:0;gap:0;text-align:left}
.hub-profile strong{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hub-profile small{color:#e9ad86;font-size:14px}
.hub-profile i,.hub-currency i,.hub-reward i{font:normal bold 20px monospace;color:#ffbc71}
.hub-header .hub-currency{min-width:52px;font-size:15px;color:#ffe1ac}
.hub-header .hub-currency.cosmetics,.hub-header .hub-currency.cosmetics i{color:#dfabfa}
.hub-settings{font-size:21px}
.hub-xp{grid-column:1/-1;display:flex;align-items:center;gap:8px;font:bold 12px monospace;color:#edcba8}
.hub-meter{flex:1;height:8px;background:#221823;border:1px solid #89463f;padding:1px}
.hub-meter b{display:block;height:100%;background:linear-gradient(90deg,#ac3929,#ffb971)}
.hub-hero{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:clamp(290px,49dvh,505px);padding:16px 7px 10px;text-align:left}
.hub-title{margin-top:clamp(7px,4dvh,44px);font:900 clamp(13px,4vw,19px) monospace;letter-spacing:.18em;color:#f6d3b5;text-shadow:2px 2px #181019}
.hub-title h1{margin:0;font:italic 1000 clamp(49px,13vw,84px)/.95 Impact,'Arial Black',sans-serif;letter-spacing:-.035em;color:#fff1d8;text-shadow:2px 2px #801e26,4px 4px #3e1724,0 0 21px #b84842}
.hub-online{position:absolute;right:6px;top:48%;font:700 12px monospace;min-height:48px;color:#f0e5d4;background:#1e191fdd;border-color:#947164;padding:5px 8px}
.hub-online b{display:inline-block;width:7px;height:7px;border-radius:100%;background:#b2de8d;margin-right:1px}
.hub-play{width:100%;display:grid;gap:7px;grid-template-columns:1fr 85px;align-items:stretch}
.hub-play .hub-primary{min-height:65px;display:flex;align-items:center;gap:12px;padding:5px 12px;text-align:left;background:linear-gradient(120deg,#a83031,#631c23 72%,#311622);border:1px solid #ff885e;box-shadow:inset 0 0 0 2px #32131a,0 5px 0 #3a1721;color:#fff0d8}
.hub-primary span{flex:1;display:grid}
.hub-primary strong{font:900 27px/.95 Impact,'Arial Black',sans-serif;letter-spacing:.08em}
.hub-primary small{font:700 13px monospace;color:#ffc190}
.hub-primary i,.hub-primary b{font:normal bold 29px monospace;color:#ffb58d}
.hub-coop{font:bold 15px monospace;border-color:#94604d;background:#2b212c}
.hub-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:11px 0 8px}
.hub-tiles button,.hub-nav button{min-width:0;display:grid;gap:1px;justify-items:center;align-content:center;padding:4px 2px;border-color:#63454b;background:linear-gradient(#2b222b,#1a161d);font:bold clamp(10px,2.85vw,14px) monospace}
.hub-tiles i,.hub-nav i{font:normal bold 21px monospace;color:#edb490}
.hub-tiles button{min-height:60px}
.hub-reward{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid #785472;background:linear-gradient(105deg,#422b47,#271e2b 75%);padding:5px 7px;margin:6px 0 10px}
.hub-reward div{flex:1;display:grid;font:bold 14px monospace}
.hub-reward small{font:12px monospace;color:#e1bbdb}
.hub-reward i{color:#e4a6ff;margin-left:4px}
.hub-reward button{border-color:#976988;font:bold 13px monospace;background:#352538}
.hub-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px 0 7px;background:#120e18;position:sticky;bottom:0}
.hub-nav button:first-child{background:#54252b;border-color:#dd765e}
.hub-nav button:hover,.hub-tiles button:hover,.hub-header button:hover{border-color:#e48f72}
@media(orientation:landscape) and (max-height:500px){.hub-hero{min-height:245px}.hub-title{margin-top:9px}}

#menu[data-meta-page]:not([data-meta-page=home]) #panel{border-color:#9a554f;background:linear-gradient(150deg,#342029,#211923 48%,#1a1821);box-shadow:0 0 24px #140d1b}
#menu[data-meta-page]:not([data-meta-page=home]) #panel>h2{background:linear-gradient(90deg,#722a33,#3e2230 76%,transparent);padding:9px;text-align:left;border-left:3px solid #ef9675;text-transform:uppercase;font-size:20px}
#panel .primary{background:#702932;border-color:#e87e66}
.hub-online{top:61%}
.hub-event{position:absolute;right:6px;top:35%;display:grid;text-align:left;padding:5px 26px 5px 9px;min-height:52px;border-color:#d76c68;background:linear-gradient(115deg,#54212edc,#251323e8)}
.hub-event small{font:700 10px monospace;color:#ffc5a5}
.hub-event strong{font:bold 13px monospace;color:#ff937e}
.hub-event b{position:absolute;right:9px;top:11px;font:700 22px monospace;color:#f18f76}
.loadout-grid,.hero-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:9px 0}
.hero-card,.loadout-card{display:grid;gap:2px;justify-items:center;align-items:center;min-width:0;padding:6px 2px;background:linear-gradient(150deg,#302533,#1a1822);border-color:#73555d;text-align:center;font:700 12px monospace;color:#f4e3d4}
.hero-card.current,.loadout-card.current{background:#512733;border-color:#ea8c72}
.hero-card img,.loadout-card img{image-rendering:pixelated;object-fit:contain}
.hero-card img{width:100%;height:84px}
.loadout-card img{width:75%;height:49px}
.hero-card small,.loadout-card small{color:#e3b799;font-size:11px}
.loadout-detail,.raid-card{text-align:left;padding:9px 11px;margin:8px 0;border:1px solid #936259;background:#1a1620}
.loadout-detail h3,.raid-card h3{font:700 18px monospace;color:var(--accent,#f6bc95);margin:2px 0 7px}
.loadout-detail button,.raid-card button{width:100%;margin-top:6px}
.stat-meter{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;font:700 12px monospace;margin:4px 0}
.stat-meter>b{height:7px;background:#351f2b}.stat-meter i{display:block;height:100%;background:#da775c}
.upgrade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:7px 0}
.upgrade-grid .card{min-height:84px;padding:6px;grid-template-columns:18px 1fr;border-color:#85515a;background:#30202b}
.upgrade-grid .card b:first-child{font-size:15px;color:#fda284}
.upgrade-grid .card small{font-size:11px}
.quest-row{display:grid;gap:3px;text-align:left;padding:7px 9px;margin:5px 0;background:#211a25;border:1px solid #6b4650}
.quest-row progress{width:100%;height:8px;accent-color:#f2a574}
.quest-row small{color:#efbc9b}
.meta-volume output{justify-self:end;color:#f8ad8d}
.meta-volume input{grid-column:1/-1;min-height:38px;accent-color:#ed765e;touch-action:none}
.hud-top{gap:5px;grid-template-columns:minmax(78px,1fr) 1fr 48px;align-items:start;padding:5px 8px}
#pause{grid-column:3;grid-row:1;justify-self:end;background:#241821e8;border-color:#a95552}
#hud-health{grid-column:1;grid-row:1;padding:5px 7px;background:#281820eb;border:1px solid #a24b4b;color:#ffded3;align-self:stretch}
#hud-health .track{height:5px;margin-top:4px}#health-fill{background:#e65a5f}
#hud-tally{grid-column:2;grid-row:1;text-align:center;padding-top:3px;color:#fae3c6;text-shadow:1px 2px #05050a}
#hud-tally small{display:flex;gap:6px;justify-content:center;font:700 12px monospace;color:#e5bca3}#clock{font-size:14px}
#field-kit{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 19px);right:calc(env(safe-area-inset-right) + 12px);display:grid;gap:8px}
#field-kit button{pointer-events:auto;min-width:58px;min-height:54px;border-radius:50%;border-color:#dc795b;background:#582d36eb;font:bold 14px monospace;box-shadow:inset 0 0 0 2px #281623}
#field-kit button:disabled{opacity:.72;color:#cfa693;background:#2a2029}
.left-handed #field-kit{right:auto;left:calc(env(safe-area-inset-left) + 12px)}
</style>
<canvas aria-label="Les Cendres du Marais"></canvas>
<div id="hud" hidden>
  <div class="track"><i id="experience"></i></div>
  <div class="hud-top"><div id="hud-health"><span aria-hidden="true">♥</span> <span id="health-text"></span><div class="track"><i id="health-fill"></i></div></div>
    <div id="hud-tally"><span id="wave"></span><small><span id="clock"></span><span id="kills"></span><span id="level"></span></small></div>
    <button id="pause" type="button" aria-label="Pause">Ⅱ</button></div>
  <div id="field-kit" aria-label="Équipement de terrain" hidden><button type="button" data-field="pulse">Onde</button><button type="button" data-field="heal" aria-label="Kit de soin">✚ 1</button></div>
  <div id="boss" hidden><span></span><div class="track"><i></i></div></div>
  <div id="kit"></div>
</div>
<aside id="quick-emotes" aria-label="Emotes rapides" hidden></aside>
<aside id="social-banner" aria-label="Invitations" hidden></aside>
<section id="menu"><canvas id="home-art" aria-hidden="true"></canvas><div id="panel"></div></section>
<output id="fps">– FPS</output>
